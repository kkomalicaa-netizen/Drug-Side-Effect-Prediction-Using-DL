{% extends "base.html" %}
{% block content %}
<div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8 space-y-8 animate-[fadeInUp_0.6s_ease-out]">
        
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-white">Create an Account</h2>
            <p class="mt-2 text-center text-sm text-slate-400">Join to access AI drug predictions</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-500 px-4 py-3 rounded-lg text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form class="mt-8 space-y-5" action="/signup" method="POST">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Full Name</label>
                <input id="name" name="name" type="text" required class="appearance-none rounded-lg relative block w-full px-3 py-2.5 border border-slate-700 bg-slate-900 placeholder-slate-500 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm shadow-inner transition duration-200" placeholder="John Doe">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Age</label>
                    <input name="age" type="number" required class="appearance-none rounded-lg relative block w-full px-3 py-2.5 border border-slate-700 bg-slate-900 placeholder-slate-500 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm shadow-inner transition duration-200" placeholder="e.g. 30">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Phone Number</label>
                    <input name="phone" type="tel" required class="appearance-none rounded-lg relative block w-full px-3 py-2.5 border border-slate-700 bg-slate-900 placeholder-slate-500 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm shadow-inner transition duration-200" placeholder="+123456789">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input id="email" name="email" type="email" required class="appearance-none rounded-lg relative block w-full px-3 py-2.5 border border-slate-700 bg-slate-900 placeholder-slate-500 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm shadow-inner transition duration-200" placeholder="you@domain.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Create Password</label>
                <input id="password" name="password" type="password" required class="appearance-none rounded-lg relative block w-full px-3 py-2.5 border border-slate-700 bg-slate-900 placeholder-slate-500 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm shadow-inner transition duration-200" placeholder="••••••••">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-900 shadow-sm transition duration-200 hover:scale-[1.02]">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-blue-400 group-hover:text-blue-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    Sign Up
                </button>
            </div>
            
            <p class="text-center text-sm text-slate-400 mt-4">
                Already have an account? <a href="/login" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">Sign in</a>
            </p>
        </form>
    </div>
</div>

<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}
